name: PHP Linting

on:
  pull_request
  push:
    branches:
      - "*"
jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - name: Laravel Pint
          uses: aglipanci/laravel-pint-action@2.6
          with:
            preset: laravel
            verboseMode: true
            testMode: true
            configPath: "pint.json"
            pintVersion: 1.8.0
            onlyDirty: true
            onlyDiff: "main"
